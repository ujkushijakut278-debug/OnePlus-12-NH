name: NetHunter Debug - OnePlus 12
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout WildKernels Source
      uses: actions/checkout@v4
      with:
        repository: WildKernels/OnePlus_KernelSU_SUSFS
        ref: main
        submodules: recursive
        fetch-depth: 1
    - name: Show full repo structure
      run: |
        echo "=== ROOT ==="
        ls -la
        echo "=== ALL DIRS ==="
        find . -type d -not -path './.git/*' | head -30
        echo "=== ALL FILES root ==="
        find . -maxdepth 2 -type f -not -path './.git/*' | head -40
        echo "=== README ==="
        cat README.md 2>/dev/null || cat readme.md 2>/dev/null || echo "No README"
