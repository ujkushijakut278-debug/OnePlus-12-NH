name: NetHunter Debug2 - OnePlus 12
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout WildKernels Source
      uses: actions/checkout@v4
      with:
        repository: WildKernels/OnePlus_KernelSU_SUSFS
        ref: main
        submodules: recursive
        fetch-depth: 1
    - name: Show configs and manifests
      run: |
        echo "=== configs/oos16 ==="
        ls -la configs/oos16/ 2>/dev/null || echo "empty"
        echo "=== manifests/oos16 ==="
        ls -la manifests/oos16/ 2>/dev/null || echo "empty"
        echo "=== manifests/oos16 content ==="
        cat manifests/oos16/*.xml 2>/dev/null | head -50
        echo "=== configs/oos16 content ==="
        cat configs/oos16/* 2>/dev/null | head -50
